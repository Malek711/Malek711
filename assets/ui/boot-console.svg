<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Malek Nabil — Backend, Data and AI Developer</title>
  <desc id="desc">Professional profile card for Malek Nabil with portrait, focus areas and core technologies.</desc>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#164E63" stop-opacity="0.48"/>
      <stop offset="0.55" stop-color="#111827" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06080D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="portrait">
      <circle cx="210" cy="210" r="142"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1000" height="420" rx="28" fill="#06080D"/>
  <rect x="18" y="18" width="964" height="384" rx="22" fill="#0D1117" stroke="#263244"/>
  <rect x="18" y="18" width="964" height="384" rx="22" fill="url(#glow)"/>
  <rect x="18" y="18" width="5" height="384" rx="2.5" fill="url(#frame)"/>

  <g filter="url(#shadow)">
    <circle cx="210" cy="210" r="151" fill="#08101D" stroke="url(#frame)" stroke-width="4"/>
    <image
      href="https://raw.githubusercontent.com/Malek711/Malek711/main/assets/profile.png"
      x="68" y="68" width="284" height="284"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#portrait)"
    />
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="405" y="103" fill="#22D3EE" font-size="14" font-weight="700" letter-spacing="3">HELLO, I'M</text>
    <text x="405" y="160" fill="#F8FAFC" font-size="48" font-weight="750">Malek Nabil</text>
    <text x="405" y="202" fill="#94A3B8" font-size="21">Backend · Data · AI</text>

    <path d="M405 230H920" stroke="#263244"/>

    <text x="405" y="268" fill="#CBD5E1" font-size="16">Building reliable systems where data meets intelligence.</text>
    <text x="405" y="300" fill="#64748B" font-size="14">Software Engineering · Ibb University · Yemen</text>

    <g font-size="13" font-weight="650">
      <rect x="405" y="330" width="68" height="34" rx="17" fill="#0E2930" stroke="#155E75"/>
      <text x="439" y="352" text-anchor="middle" fill="#67E8F9">C#</text>

      <rect x="485" y="330" width="72" height="34" rx="17" fill="#211A38" stroke="#6D28D9"/>
      <text x="521" y="352" text-anchor="middle" fill="#C4B5FD">.NET</text>

      <rect x="569" y="330" width="112" height="34" rx="17" fill="#0E2930" stroke="#155E75"/>
      <text x="625" y="352" text-anchor="middle" fill="#67E8F9">SQL Server</text>

      <rect x="693" y="330" width="90" height="34" rx="17" fill="#211A38" stroke="#6D28D9"/>
      <text x="738" y="352" text-anchor="middle" fill="#C4B5FD">Python</text>
    </g>

    <circle cx="920" cy="88" r="5" fill="#22D3EE"/>
    <text x="906" y="93" text-anchor="end" fill="#64748B" font-size="11" letter-spacing="1.5">AVAILABLE TO BUILD</text>
  </g>
</svg>
