name: Generate contribution car

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-car.yml"
      - ".github/scripts/generate_contribution_car.py"

permissions:
  contents: write

concurrency:
  group: contribution-car
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate contribution car
        run: python .github/scripts/generate_contribution_car.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: /tmp/github-contribution-grid-car.svg

      - name: Publish animation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output:refs/remotes/origin/output || true

          if git rev-parse --verify origin/output >/dev/null 2>&1; then
            git switch --create output --track origin/output
          else
            git switch --orphan output
            git rm -rf . || true
          fi

          cp /tmp/github-contribution-grid-car.svg ./github-contribution-grid-car.svg
          git add github-contribution-grid-car.svg

          if ! git diff --cached --quiet; then
            git commit -m "chore: update contribution car"
            git push origin output
          fi
